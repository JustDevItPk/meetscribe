# MeetScribe is installed with ./install.sh, not pip. This file holds project metadata and tool settings.
[project]
name = "meetscribe"
version = "0.1.0"
description = "Record and transcribe meetings locally on Linux, then ask Claude about them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Saailverse Technologies" }]
keywords = ["transcription", "meetings", "speech-to-text", "whisper", "gtk", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[tool.ruff]
line-length = 150
target-version = "py310"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B905"]           # zip(strict=...) would change behaviour for no gain here

[tool.pytest.ini_options]
testpaths = ["tests"]
