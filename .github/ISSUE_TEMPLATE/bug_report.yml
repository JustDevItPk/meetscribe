name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please don't attach real meeting recordings, transcripts or files from
        `~/.config/mintomeet`**: they contain other people's voices and words. Security problems go through
        SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start recording with Whisper small
        2. Switch to Parakeet during the call
        3. ...
  - type: input
    id: version
    attributes:
      label: MintoMeet version
      description: Output of `mintomeet --version`
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and desktop
      placeholder: Ubuntu 25.10, GNOME 49, Wayland
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Speech model
      options: ["Parakeet", "Whisper small", "Whisper medium", "Not related to transcription"]
  - type: input
    id: callapp
    attributes:
      label: Call app (if relevant)
      placeholder: Zoom, Google Meet in Firefox, Teams, ...
  - type: textarea
    id: logs
    attributes:
      label: Errors
      description: Output of `journalctl --user -t gui.py --since today` (check it for anything private first).
      render: text
