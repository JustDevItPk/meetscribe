name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Check [docs/ROADMAP.md](../blob/main/docs/ROADMAP.md) first; your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or situation, in your own words. What's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Rough is fine.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
